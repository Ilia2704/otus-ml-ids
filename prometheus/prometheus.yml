global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: generator
    static_configs:
      - targets: ["generator:9101"]
  - job_name: detector
    static_configs:
      - targets: ["detector:9102"]
  - job_name: evaluator
    static_configs:
      - targets: ["evaluator:9103"]
